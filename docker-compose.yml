version: '3.8'

services:
  broker_mqtt:
    image: eclipse-mosquitto:latest
    container_name: broker_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - luflex_net

  nodered_luflex:
    image: nodered/node-red:latest
    container_name: nodered_luflex
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - broker_mqtt
    restart: unless-stopped
    networks:
      - luflex_net

volumes:
  nodered_data:
  mosquitto_data:
  mosquitto_log:

networks:
  luflex_net:
    driver: bridge